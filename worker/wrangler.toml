name = "corbitrage-lead-handler"
main = "lead-handler.js"
compatibility_date = "2026-01-01"

# Secrets (NEVER commit real values). Set with:
#   npx wrangler secret put MAKE_WEBHOOK_URL
# MAKE_WEBHOOK_URL = the Make.com custom webhook URL that receives leads.

[vars]
# Comma-separated list of origins allowed to call this Worker.
# Add your Cloudflare Pages preview/staging origin here while testing,
# e.g. "https://corbitrage.com,https://www.corbitrage.com,https://staging.corbitrage-media.pages.dev"
ALLOWED_ORIGINS = "https://corbitrage.com,https://www.corbitrage.com"
