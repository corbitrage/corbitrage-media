<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Corbitrage — Compounding + Arbitrage</title>
<desc id="desc">A metallic blue infinity symbol combining a DNA helix and a spiral, above the Corbitrage wordmark.</desc>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="0.18" y2="1">
    <stop offset="0" stop-color="#b9f5ff"/>
    <stop offset=".16" stop-color="#087fcb"/>
    <stop offset=".32" stop-color="#062c58"/>
    <stop offset=".5" stop-color="#28c5ff"/>
    <stop offset=".68" stop-color="#064b86"/>
    <stop offset=".86" stop-color="#001b3b"/>
    <stop offset="1" stop-color="#36cfff"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
