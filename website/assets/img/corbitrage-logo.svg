  <path d="M500 150 C420 50 340 10 260 10 C120 10 40 90 40 150 C40 210 120 290 260 290 C340 290 420 250 500 150 C580 50 660 10 740 10 C880 10 960 90 960 150 C960 210 880 290 740 290 C660 290 580 250 500 150" stroke="#a9edff" stroke-width="3" opacity=".75"/>
