    <stop offset=".48" stop-color="#087fc4"/>
    <stop offset=".72" stop-color="#42d5ff"/>
    <stop offset="1" stop-color="#06284e"/>
  </linearGradient>
  <linearGradient id="type" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#168ac8"/>
    <stop offset=".42" stop-color="#073c69"/>
